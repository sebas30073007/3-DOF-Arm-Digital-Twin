# Publica Pólux (la carpeta gemelo/) en GitHub Pages en cada push a main.
# Una sola vez: Settings -> Pages -> Source: GitHub Actions.
name: Publicar Pólux

on:
  push:
    branches: [main]
    paths: ["gemelo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gemelo
      - id: deploy
        uses: actions/deploy-pages@v4
